<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Некъ — семейное древо онлайн. Посмотрите демо, войдите с логином и паролем семьи или закажите своё."
    />
    <meta name="theme-color" content="#121a14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Некъ" />
    <link rel="canonical" href="https://waydean.ru/nek/" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Некъ — семейное древо</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="./nek.css?v=8" />
  </head>
  <body>
    <div class="hero-plane" aria-hidden="true">
      <div class="hero-photo"></div>
      <div class="hero-veil"></div>
      <div class="hero-glow"></div>
    </div>

    <main class="stage">
      <p class="brand" id="brand">Некъ</p>
      <h1 class="headline" id="headline">Семейное древо — одним взглядом</h1>
      <p class="lead" id="lead">
        Родственники входят по логину и паролю семьи. Без регистрации.
      </p>

      <div class="cta" id="cta" role="group" aria-label="Что сделать">
        <a class="btn btn-demo" href="/drewo-reklama/">Посмотреть демо</a>
        <button type="button" class="btn btn-enter" id="login-open">Войти</button>
        <a
          class="btn btn-order"
          href="https://wa.me/79288867854?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5!%20%D0%A5%D0%BE%D1%87%D1%83%20%D0%B7%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D1%82%D1%8C%20%D1%81%D0%B5%D0%BC%D0%B5%D0%B9%D0%BD%D0%BE%D0%B5%20%D0%B4%D1%80%D0%B5%D0%B2%D0%BE%20%D0%9D%D0%B5%D0%BA%D1%8A."
          target="_blank"
          rel="noopener noreferrer"
          >Хочу своё древо</a
        >
      </div>

      <form id="login-panel" class="login-panel" hidden>
        <div class="login-field">
          <label for="login-input">Логин семьи</label>
          <input
            id="login-input"
            name="username"
            type="text"
            maxlength="40"
            autocomplete="username"
            autocapitalize="off"
            spellcheck="false"
            placeholder="например hoti"
            required
          />
        </div>

        <div class="login-field">
          <label for="password-input">Пароль семьи</label>
          <div class="password-row">
            <input
              id="password-input"
              name="password"
              type="password"
              maxlength="64"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              id="password-toggle"
              aria-controls="password-input"
              aria-pressed="false"
            >
              Показать
            </button>
          </div>
        </div>

        <label class="remember-row">
          <input type="checkbox" id="login-remember" />
          <span>Запомнить на этом устройстве</span>
        </label>

        <button type="submit" class="btn btn-enter" id="login-submit">Войти</button>
        <p id="login-error" class="login-error" role="alert" hidden></p>
        <button type="button" class="linkish" id="login-cancel">Назад</button>
      </form>

      <p id="recent" class="recent" hidden>
        <a id="recent-link" href="#">Открыть последнее древо</a>
      </p>

      <div id="pwa-banner" class="pwa-banner" hidden>
        <div>
          <strong>Установить Некъ</strong>
          <p>На экран Домой — как приложение</p>
        </div>
        <div class="pwa-banner-actions">
          <button type="button" id="pwa-install" class="btn btn-enter btn-compact">Установить</button>
          <button type="button" id="pwa-dismiss" class="linkish">Позже</button>
        </div>
      </div>
    </main>

    <script src="./nek.js?v=8"></script>
  </body>
</html>
