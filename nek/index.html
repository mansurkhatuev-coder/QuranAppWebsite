<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Некъ — семейное древо онлайн. Посмотрите демо, откройте своё по коду или закажите новое."
    />
    <meta name="theme-color" content="#1a2418" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Некъ" />
    <link rel="canonical" href="https://waydean.ru/nek/" />
    <link rel="icon" type="image/png" sizes="192x192" href="../trees/icon-192.png" />
    <link rel="apple-touch-icon" href="../trees/apple-touch-icon.png" />
    <title>Некъ — семейное древо</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="./nek.css?v=2" />
  </head>
  <body>
    <div class="hero-plane" aria-hidden="true">
      <div class="hero-photo"></div>
      <div class="hero-veil"></div>
      <div class="hero-glow"></div>
    </div>

    <main class="stage">
      <p class="brand" id="brand">Некъ</p>
      <h1 class="headline" id="headline">Семейное древо — одним взглядом</h1>
      <p class="lead" id="lead">
        Родственники входят по ссылке и паролю семьи. Без регистрации.
      </p>

      <div class="cta" id="cta" role="group" aria-label="Что сделать">
        <a class="btn btn-primary" href="/drewo-reklama/">Посмотреть демо</a>
        <button type="button" class="btn btn-secondary" id="have-code-btn">У меня есть код</button>
        <a
          class="btn btn-ghost"
          href="mailto:neunitxadi@mail.ru?subject=%D0%A5%D0%BE%D1%87%D1%83%20%D1%81%D0%B5%D0%BC%D0%B5%D0%B9%D0%BD%D0%BE%D0%B5%20%D0%B4%D1%80%D0%B5%D0%B2%D0%BE"
          >Хочу своё древо</a
        >
      </div>

      <form id="code-panel" class="code-panel" hidden>
        <label for="code-input">Код из сообщения</label>
        <div class="code-row">
          <input
            id="code-input"
            name="code"
            type="text"
            maxlength="25"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="например demo"
            required
          />
          <button type="submit" class="btn btn-primary" id="code-submit">Открыть</button>
        </div>
        <p id="code-error" class="code-error" hidden>Нет такого древа</p>
        <button type="button" class="linkish" id="code-cancel">Назад</button>
      </form>

      <p id="recent" class="recent" hidden>
        <a id="recent-link" href="#">Открыть последнее древо</a>
      </p>
    </main>

    <script src="./nek.js?v=2"></script>
  </body>
</html>
