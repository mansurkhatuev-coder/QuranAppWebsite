<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Рассрочки · офлайн</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f4f6f8; color: #0f172a; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 0 0 env(safe-area-inset-bottom); }
      header { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid #dce3e8; padding: 14px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
      .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1040px; margin: auto; }
      h1 { margin: 0; font-size: 20px; }
      .muted { color: #64748b; font-size: 13px; }
      #online-action { display: none; margin-bottom: 12px; }
      .badge { border-radius: 999px; background: #e2e8f0; padding: 5px 10px; font-size: 12px; white-space: nowrap; }
      .badge.offline { color: #92400e; background: #fef3c7; }
      .badge.online { color: #166534; background: #dcfce7; }
      main { max-width: 1040px; margin: auto; padding: 16px; }
      #sync-info { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; border: 1px solid #dce3e8; border-radius: 12px; background: #fff; padding: 9px 11px; font-size: 13px; }
      #sync-detail { color: #64748b; font-size: 12px; }
      #sync-error-details { flex-basis: 100%; color: #64748b; font-size: 12px; }
      #sync-error-details summary { width: fit-content; cursor: pointer; }
      #sync-error-text { margin: 4px 0 0; overflow-wrap: anywhere; white-space: pre-wrap; }
      nav { display: flex; gap: 6px; max-width: 1040px; overflow-x: auto; margin: 10px auto 0; padding-bottom: 10px; scrollbar-width: thin; }
      button, a.button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; background: #f1f5f9; color: #334155; padding: 10px 13px; text-decoration: none; white-space: nowrap; }
      nav button[aria-current="page"] { background: #0f766e; color: white; }
      .card { margin-bottom: 12px; border: 1px solid #dce3e8; border-radius: 14px; background: white; padding: 14px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .stat { font-size: 22px; font-weight: 700; margin-top: 4px; }
      .list { display: grid; gap: 8px; }
      .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid #e2e8f0; }
      .row:last-child { border: 0; }
      .row button { padding: 6px 8px; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
      .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .field { display: grid; gap: 5px; font-size: 13px; }
      .field.full { grid-column: 1 / -1; }
      input, select, textarea { width: 100%; min-width: 0; border: 1px solid #cbd5e1; border-radius: 9px; padding: 10px; font: inherit; color: #0f172a; background: white; }
      textarea { min-height: 82px; resize: vertical; }
      input[type="checkbox"] { width: auto; }
      .check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
      button.primary { background: #0f766e; color: white; }
      button.danger-button { color: #b91c1c; background: #fef2f2; }
      button:disabled { opacity: .55; cursor: not-allowed; }
      .badge.pending { color: #92400e; background: #fef3c7; }
      .badge.conflict { color: #991b1b; background: #fee2e2; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { padding: 9px 8px; text-align: left; border-bottom: 1px solid #e2e8f0; }
      th { color: #64748b; font-weight: 600; }
      .warning { border-color: #fcd34d; background: #fffbeb; color: #78350f; }
      .danger { color: #b91c1c; }
      @media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } .field.full { grid-column: auto; } .row { align-items: flex-start; } }
      @media (min-width: 700px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } main { padding: 22px 18px; } }
    </style>
  </head>
  <body>
    <header>
      <div class="head">
        <div><h1>Рассрочки</h1><div class="muted" id="org-name">Офлайн-режим</div></div>
        <div class="actions"><span class="badge offline" id="network-state">Без сети</span><button type="button" id="clear-offline" title="Удалить офлайн-копию только текущей организации">Очистить</button></div>
      </div>
      <nav aria-label="Разделы">
        <button type="button" data-view="dashboard" aria-current="page">Обзор</button>
        <button type="button" data-view="clients">Клиенты</button>
        <button type="button" data-view="loans">Рассрочки</button>
      </nav>
    </header>
    <main>
      <div id="sync-info" role="status" aria-live="polite">
        <span id="sync-state" class="badge pending">Загрузка…</span>
        <span id="sync-detail">Проверяем копию</span>
        <span id="sync-pending" class="badge pending" hidden></span>
        <span id="sync-conflicts" class="badge conflict" hidden></span>
        <details id="sync-error-details" hidden>
          <summary>Подробности</summary>
          <p id="sync-error-text"></p>
        </details>
      </div>
      <div id="online-action"><button type="button" id="sync-now" class="primary">Синхронизировать</button> <a class="button" href="/dashboard">Обычная версия</a></div>
      <section id="content" aria-live="polite"></section>
      <p class="muted">Изменения сохраняются на устройстве и синхронизируются при подключении.</p>
    </main>
    <script defer src="/offline.js"></script>
  </body>
</html>
