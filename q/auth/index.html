<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0B0F13" />
    <meta name="color-scheme" content="dark" />
    <title>Вход ученика — Академия</title>
    <link rel="icon" href="../../assets/icon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Manrope:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="../../academy/academy.css?v=11" />
    <link rel="stylesheet" href="../q.css?v=1" />
  </head>
  <body class="academy-body">
    <div class="academy-shell">
      <div class="academy-top">
        <a class="academy-brand" href="/">
          <img src="../../assets/icon.png" width="36" height="36" alt="" />
          <strong>Академия</strong>
        </a>
        <a class="academy-btn academy-btn--ghost" id="back-hub" href="/q/">К урокам</a>
      </div>

      <p class="academy-kicker">Ученикам</p>
      <h1 class="academy-title academy-title--sm">Личный кабинет</h1>
      <p class="academy-muted">Отдельный вход ученика — не смешивается с кабинетом учителя.</p>

      <div class="academy-card">
        <div class="q-auth-tabs" role="tablist">
          <button type="button" class="academy-btn academy-btn--primary" id="tab-login" data-mode="login">Вход</button>
          <button type="button" class="academy-btn" id="tab-register" data-mode="register">Регистрация</button>
        </div>

        <form id="auth-form" class="academy-form" autocomplete="on">
          <label id="name-field" hidden>
            Имя
            <input id="auth-name" name="display_name" maxlength="40" autocomplete="nickname" placeholder="Амина" />
          </label>
          <label>
            Email
            <input id="auth-email" name="email" type="email" autocomplete="username" required />
          </label>
          <label>
            Пароль
            <span class="q-password-wrap">
              <input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="6" />
              <button type="button" class="q-password-toggle" id="btn-toggle-password" aria-label="Показать пароль">Показать</button>
            </span>
          </label>
          <div class="academy-actions">
            <button type="submit" class="academy-btn academy-btn--primary" id="auth-submit">Войти</button>
          </div>
          <button type="button" class="academy-btn academy-btn--ghost" id="btn-recover" style="margin-top:0.5rem">
            Забыли пароль?
          </button>
          <p id="auth-error" class="academy-error" hidden></p>
          <p id="auth-ok" class="academy-ok" hidden></p>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../admin/supabase-config.js?v=7"></script>
    <script src="../../academy/academy-shared.js?v=6"></script>
    <script src="./auth.js?v=1"></script>
  </body>
</html>
