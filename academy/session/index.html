<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0B0F13" />
    <title>Сессия урока — Академия</title>
    <link rel="icon" href="../../assets/icon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Manrope:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="../academy.css?v=1" />
  </head>
  <body class="academy-body">
    <div class="academy-shell">
      <div class="academy-top">
        <a class="academy-brand" href="../">
          <img src="../../assets/icon.png" width="36" height="36" alt="" />
          <strong>Host</strong>
        </a>
        <a class="academy-btn academy-btn--ghost" href="../">К урокам</a>
      </div>

      <p class="academy-kicker">Экран учителя</p>
      <h1 class="academy-title">Сессия</h1>
      <p class="academy-muted">
        Фаза 0: восстановление по <code>session_id</code> после обновления страницы. Управление live
        (Далее / QR) — в следующей фазе.
      </p>

      <div class="academy-card">
        <p id="session-status" class="academy-muted">Загрузка…</p>
        <p id="session-pin" class="academy-pin" hidden></p>
        <p id="session-meta" class="academy-muted" hidden></p>
        <p id="session-error" class="academy-error" hidden></p>
        <div class="academy-actions">
          <button type="button" class="academy-btn" id="btn-reload">Обновить состояние</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../admin/supabase-config.js?v=6"></script>
    <script src="../academy-shared.js?v=1"></script>
    <script src="./session.js?v=1"></script>
  </body>
</html>
