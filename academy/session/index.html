<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0B0F13" />
    <meta name="color-scheme" content="dark" />
    <title>Дашборд урока — Академия</title>
    <link rel="icon" href="../../assets/icon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Manrope:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="../academy.css?v=7" />
  </head>
  <body class="academy-body">
    <div class="academy-shell academy-shell--wide">
      <div class="academy-top">
        <a class="academy-brand" href="../">
          <img src="../../assets/icon.png" width="36" height="36" alt="" />
          <strong>Учитель</strong>
        </a>
        <a class="academy-btn academy-btn--ghost" href="../">К урокам</a>
      </div>

      <p class="academy-kicker">Дашборд live-урока</p>
      <h1 class="academy-title">Сессия</h1>
      <p class="academy-muted" id="join-link">—</p>

      <div class="academy-dash-grid">
        <div class="academy-card">
          <p id="session-pin" class="academy-pin" hidden></p>
          <p id="session-meta" class="academy-muted">Загрузка…</p>
          <div id="timer-box" class="academy-timer" hidden>
            <div class="academy-timer__label">Таймер вопроса</div>
            <div id="timer-value" class="academy-timer__value">—</div>
            <div class="academy-timer__bar"><span id="timer-bar"></span></div>
          </div>
          <p id="question-box" class="academy-question-prompt" hidden></p>
          <div id="options-box" class="academy-host-options-wrap" hidden></div>
          <p id="session-error" class="academy-error" hidden></p>
          <div class="academy-actions">
            <button type="button" class="academy-btn academy-btn--primary" id="btn-start">Начать</button>
            <button type="button" class="academy-btn" id="btn-reveal">Показать ответ</button>
            <button type="button" class="academy-btn" id="btn-next">Далее</button>
            <button type="button" class="academy-btn" id="btn-finish">Завершить</button>
            <button type="button" class="academy-btn academy-btn--ghost" id="btn-reload">Обновить</button>
          </div>
        </div>

        <div class="academy-card">
          <p class="academy-kicker">Ответы класса</p>
          <div id="stats-box" class="academy-stats" hidden></div>
          <div id="board-box" class="academy-board">
            <p class="academy-muted">Пока никого</p>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../admin/supabase-config.js?v=7"></script>
    <script src="../academy-shared.js?v=5"></script>
    <script src="./session.js?v=6"></script>
  </body>
</html>
