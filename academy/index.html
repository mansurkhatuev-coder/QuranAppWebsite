<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0B0F13" />
    <title>Академия — уроки для медресе</title>
    <link rel="icon" href="../assets/icon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Manrope:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="./academy.css?v=2" />
  </head>
  <body class="academy-body">
    <div class="academy-shell academy-shell--wide">
      <div class="academy-top">
        <a class="academy-brand" href="/">
          <img src="../assets/icon.png" width="36" height="36" alt="" />
          <strong>Академия</strong>
        </a>
        <a class="academy-btn academy-btn--ghost" href="/join/">Вход ученика</a>
      </div>

      <div id="login-view">
        <p class="academy-kicker">Учителям медресе</p>
        <h1 class="academy-title">Live-уроки</h1>
        <p class="academy-muted">
          Войдите аккаунтом учителя. Ученики — по коду:
          <a href="/join/">waydean.ru/join/</a>
        </p>
        <div class="academy-card">
          <form id="login-form" class="academy-form" autocomplete="on">
            <label>
              Email
              <input id="login-email" name="email" type="email" autocomplete="username" required />
            </label>
            <label>
              Пароль
              <input id="login-password" name="password" type="password" autocomplete="current-password" required />
            </label>
            <div class="academy-actions">
              <button type="submit" class="academy-btn academy-btn--primary" id="login-submit">Войти</button>
            </div>
            <p id="login-error" class="academy-error" hidden></p>
          </form>
        </div>
      </div>

      <div id="app-view" hidden>
        <p class="academy-kicker">Кабинет учителя</p>
        <h1 class="academy-title">Мои уроки</h1>
        <p class="academy-muted" id="teacher-hello">—</p>

        <div class="academy-actions">
          <button type="button" class="academy-btn academy-btn--primary" id="btn-new-lesson">Создать урок</button>
          <button type="button" class="academy-btn" id="btn-refresh">Обновить</button>
          <button type="button" class="academy-btn academy-btn--ghost" id="btn-logout">Выйти</button>
        </div>

        <div class="academy-card" id="editor-card" hidden>
          <p class="academy-kicker">Новый урок</p>
          <form id="lesson-form" class="academy-form">
            <label>
              Название
              <input id="lesson-title" required maxlength="120" placeholder="Условия намаза" />
            </label>
            <label>
              Предмет
              <select id="lesson-subject">
                <option value="fiqh">Фикх</option>
                <option value="aqida">Акыда</option>
                <option value="sira">Сира</option>
                <option value="quran">Коран</option>
                <option value="hadith">Хадисы</option>
                <option value="arabic">Арабский</option>
                <option value="other">Другое</option>
              </select>
            </label>
            <div id="questions-editor"></div>
            <div class="academy-actions">
              <button type="button" class="academy-btn" id="btn-add-question">+ Вопрос</button>
              <button type="submit" class="academy-btn academy-btn--primary">Сохранить урок</button>
              <button type="button" class="academy-btn academy-btn--ghost" id="btn-cancel-editor">Отмена</button>
            </div>
            <p id="editor-error" class="academy-error" hidden></p>
          </form>
        </div>

        <div class="academy-card">
          <div id="lessons-empty" class="academy-empty" hidden>Уроков пока нет — создайте первый.</div>
          <ul id="lessons-list" class="academy-list" hidden></ul>
          <p id="app-error" class="academy-error" hidden></p>
          <p id="app-status" class="academy-ok" hidden></p>
        </div>

        <div class="academy-card" id="active-sessions-card" hidden>
          <p class="academy-kicker">Активные сессии</p>
          <ul id="sessions-list" class="academy-list"></ul>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../admin/supabase-config.js?v=7"></script>
    <script src="./academy-shared.js?v=2"></script>
    <script src="./question-types.js?v=1"></script>
    <script src="./academy.js?v=5"></script>
  </body>
</html>
