<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f1c16" />
    <title>Приглашение в древо</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;650;700&family=Fraunces:opsz,wght@9..144,500;9..144,560;9..144,650&display=swap"
    />
    <link rel="stylesheet" href="./invite.css?v=1" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <main class="card" id="card">
      <p class="brand">Trees</p>
      <h1 id="title">Приглашение</h1>
      <p class="muted" id="subtitle">Открываем нужное древо…</p>
      <p id="error" class="error" hidden>Нет такого древа</p>
      <form id="manual-form" class="manual" hidden>
        <label>
          Код древа
          <input
            id="code-input"
            name="code"
            type="text"
            maxlength="25"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="например hoti"
            required
          />
        </label>
        <button type="submit" class="btn">Открыть</button>
      </form>
      <p class="hint" id="hint" hidden>
        Ссылку родственникам лучше слать целиком: <code>waydean.ru/t/код</code>
      </p>
    </main>
    <script src="../trees/supabase-config.js?v=2"></script>
    <script src="./invite.js?v=1"></script>
  </body>
</html>
