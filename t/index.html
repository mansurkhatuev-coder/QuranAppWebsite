<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Приглашение в древо</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var code = params.get('c') || params.get('code');
        var target = new URL('/nek/', window.location.origin);
        target.searchParams.set('login', '1');
        if (code) target.searchParams.set('u', code);
        window.location.replace(target.pathname + target.search);
      })();
    </script>
  </head>
  <body>
    <p><a href="/nek/?login=1">Войти в Некъ</a></p>
  </body>
</html>
