name: Deploy Supabase store-downloads function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure App Store secrets for Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          if not (os.environ.get('SUPABASE_ACCESS_TOKEN') or '').strip():
              print('Missing SUPABASE_ACCESS_TOKEN')
              sys.exit(1)
          required = ['APP_STORE_ISSUER_ID', 'APP_STORE_KEY_ID', 'APP_STORE_PRIVATE_KEY']
          missing = [name for name in required if not (os.environ.get(name) or '').strip()]
          if missing:
              print('Missing GitHub secrets:', ', '.join(missing))
              sys.exit(1)

          def quote(value: str) -> str:
              return '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n') + '"'

          path = Path('/tmp/app-store-secrets.env')
          path.write_text(
              '\n'.join([
                  f"APP_STORE_ISSUER_ID={os.environ['APP_STORE_ISSUER_ID'].strip()}",
                  f"APP_STORE_KEY_ID={os.environ['APP_STORE_KEY_ID'].strip()}",
                  f"APP_STORE_PRIVATE_KEY={quote(os.environ['APP_STORE_PRIVATE_KEY'].strip())}",
                  'APP_STORE_APP_ID=6782619598',
                  f"SUPABASE_MGMT_TOKEN={quote(os.environ['SUPABASE_ACCESS_TOKEN'].strip())}",
              ]) + '\n',
              encoding='utf-8',
          )
          try:
              subprocess.check_call([
                  'supabase', 'secrets', 'set',
                  '--project-ref', 'rivjkiksknnesahrvamf',
                  '--env-file', str(path),
              ])
          finally:
              path.unlink(missing_ok=True)
          print('app_store_secrets_ok')
          PY

      - name: Apply store-downloads SQL
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          from pathlib import Path
          token = os.environ.get('SUPABASE_ACCESS_TOKEN') or ''
          if not token:
              print('Missing SUPABASE_ACCESS_TOKEN')
              sys.exit(1)
          sql = Path('admin/supabase-migration-store-downloads.sql').read_text(encoding='utf-8')
          req = urllib.request.Request(
              'https://api.supabase.com/v1/projects/rivjkiksknnesahrvamf/database/query',
              data=json.dumps({'query': sql}).encode('utf-8'),
              headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as res:
                  print(res.read().decode('utf-8')[:2000])
          except urllib.error.HTTPError as err:
              body = err.read().decode('utf-8', errors='replace')
              print(f'SQL API {err.code}: {body[:2000]}')
              print('Continue: run admin/supabase-migration-store-downloads.sql in SQL Editor if tables are missing.')
          PY

      - name: Deploy store-downloads Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN repository secret"
            exit 1
          fi
          supabase functions deploy store-downloads \
            --project-ref rivjkiksknnesahrvamf \
            --no-verify-jwt \
            --use-api
