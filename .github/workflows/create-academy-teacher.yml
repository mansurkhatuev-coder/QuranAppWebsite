# Optional: re-provision Academy teacher via workflow_dispatch.
# Pass email/password/name as inputs (not stored in the repo).

name: Create Academy teacher

on:
  workflow_dispatch:
    inputs:
      email:
        description: Teacher email
        required: true
        type: string
      password:
        description: Teacher password (min 8)
        required: true
        type: string
      name:
        description: Display name
        required: true
        default: Учитель медресе
        type: string

permissions:
  contents: read

concurrency:
  group: create-academy-teacher
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create / update teacher
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
          SUPABASE_URL: https://rivjkiksknnesahrvamf.supabase.co
          TEACHER_EMAIL: ${{ inputs.email }}
          TEACHER_PASSWORD: ${{ inputs.password }}
          TEACHER_NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          node scripts/create-academy-teacher.mjs

      - name: Verify teacher row
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
          TEACHER_EMAIL: ${{ inputs.email }}
        run: |
          set -euo pipefail
          BODY=$(mktemp); RESP=$(mktemp)
          python3 - "$TEACHER_EMAIL" "$BODY" <<'PY'
          import json, sys
          email = sys.argv[1].replace("'", "''")
          q = f"""
          select t.user_id::text, t.display_name, t.is_active, u.email
          from public.academy_teachers t
          left join auth.users u on u.id = t.user_id
          where lower(u.email) = lower('{email}');
          """
          open(sys.argv[2], "w", encoding="utf-8").write(json.dumps({"query": q}))
          PY
          CODE=$(curl -sS -o "$RESP" -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; WaydeanMigrate/1.0; +https://waydean.ru)" \
            --data-binary @"$BODY")
          echo "verify HTTP $CODE"
          cat "$RESP"
          echo
          if [[ "$CODE" != "200" && "$CODE" != "201" ]]; then
            exit 1
          fi
          python3 - "$RESP" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          rows = data if isinstance(data, list) else []
          if not rows:
              raise SystemExit("teacher row not found")
          print("teacher ok:", rows[0].get("email"), rows[0].get("display_name"))
          PY
