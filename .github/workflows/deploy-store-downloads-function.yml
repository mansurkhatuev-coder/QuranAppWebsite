name: Deploy store-downloads Edge Function only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-store-downloads
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy store-downloads function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN repository secret"
            exit 1
          fi
          supabase functions deploy store-downloads \
            --project-ref rivjkiksknnesahrvamf \
            --no-verify-jwt \
            --use-api
