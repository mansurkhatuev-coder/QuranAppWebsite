name: Apply Academy public async migration

# Additive: academy_students, academy_public_hubs, hub lessons, sessions.hub_id
# Then deploy academy-live Edge Function.

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/academy-public-async-51a2
    paths:
      - admin/supabase-migration-academy-public-async.sql
      - supabase/functions/academy-live/**
      - .github/workflows/apply-academy-public-async.yml
      - scripts/apply-academy-live-migration.sh

permissions:
  contents: read

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply public-async migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
        run: |
          chmod +x scripts/apply-academy-live-migration.sh
          scripts/apply-academy-live-migration.sh admin/supabase-migration-academy-public-async.sql

      - name: Verify hub tables
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
        run: |
          BODY=$(mktemp)
          RESP=$(mktemp)
          python3 - <<'PY' > "$BODY"
          import json
          print(json.dumps({
            "query": """
          select table_name
          from information_schema.tables
          where table_schema = 'public'
            and table_name in (
              'academy_students','academy_public_hubs','academy_public_hub_lessons'
            )
          order by 1;
          """
          }))
          PY
          CODE=$(curl -sS -o "$RESP" -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; WaydeanMigrate/1.0; +https://waydean.ru)" \
            --data-binary @"$BODY")
          echo "HTTP $CODE"
          cat "$RESP"
          echo
          python3 - "$RESP" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(data, list):
              raise SystemExit(f"Unexpected response: {data!r}"[:500])
          names = {row.get("table_name") for row in data}
          need = {"academy_students","academy_public_hubs","academy_public_hub_lessons"}
          missing = sorted(need - names)
          if missing:
              raise SystemExit(f"Missing tables: {missing}")
          print("OK: public async tables present")
          PY

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy academy-live
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          supabase functions deploy academy-live \
            --project-ref rivjkiksknnesahrvamf \
            --no-verify-jwt \
            --use-api
