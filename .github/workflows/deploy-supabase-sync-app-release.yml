name: Deploy Supabase sync-app-release function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure secrets for sync-app-release
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WEBSITE_PUBLISH_TOKEN: ${{ secrets.WEBSITE_PUBLISH_TOKEN }}
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_API_TOKEN: ${{ secrets.RUSTORE_API_TOKEN }}
          RUSTORE_PACKAGE_NAME: ${{ secrets.RUSTORE_PACKAGE_NAME }}
          SYNC_APP_RELEASE_CRON_SECRET: ${{ secrets.SYNC_APP_RELEASE_CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN repository secret"
            exit 1
          fi
          if [ -z "$WEBSITE_PUBLISH_TOKEN" ]; then
            echo "Missing WEBSITE_PUBLISH_TOKEN repository secret"
            exit 1
          fi
          if [ -z "$RUSTORE_KEY_ID" ] || [ -z "$RUSTORE_API_TOKEN" ]; then
            echo "Missing RUSTORE_KEY_ID / RUSTORE_API_TOKEN repository secrets"
            exit 1
          fi
          if [ -z "$SYNC_APP_RELEASE_CRON_SECRET" ]; then
            echo "Missing SYNC_APP_RELEASE_CRON_SECRET repository secret"
            exit 1
          fi
          PACKAGE="${RUSTORE_PACKAGE_NAME:-com.sheyhmansur.quranapp}"
          supabase secrets set \
            --project-ref rivjkiksknnesahrvamf \
            "RUSTORE_KEY_ID=$RUSTORE_KEY_ID" \
            "RUSTORE_API_TOKEN=$RUSTORE_API_TOKEN" \
            "RUSTORE_PACKAGE_NAME=$PACKAGE" \
            "GITHUB_TOKEN=$WEBSITE_PUBLISH_TOKEN" \
            "GITHUB_REPO=mansurkhatuev-coder/QuranAppWebsite" \
            "SYNC_APP_RELEASE_CRON_SECRET=$SYNC_APP_RELEASE_CRON_SECRET"

      - name: Deploy sync-app-release Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-app-release \
            --project-ref rivjkiksknnesahrvamf \
            --no-verify-jwt \
            --use-api
