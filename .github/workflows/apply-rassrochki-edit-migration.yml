name: Apply Rassrochki Edit Migration

on:
  push:
    branches:
      - main
    paths:
      - rassrochki/supabase/migrations/016_edit_loan_transaction.sql

permissions:
  contents: read

jobs:
  apply-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply SQL to the Rassrochki Supabase project
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.RASSROCHKI_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "Required Supabase repository secrets are not configured."
            exit 1
          fi

          supabase_host="${SUPABASE_URL#https://}"
          project_ref="${supabase_host%%.*}"
          if [[ ! "$project_ref" =~ ^[a-z0-9]+$ ]]; then
            echo "RASSROCHKI_SUPABASE_URL does not contain a valid project ref."
            exit 1
          fi

          sql_file="rassrochki/supabase/migrations/016_edit_loan_transaction.sql"
          body_file="$RUNNER_TEMP/rassrochki-edit-migration.json"
          trap 'rm -f "$body_file"' EXIT
          jq -n --rawfile query "$sql_file" '{query: $query}' > "$body_file"

          api_url="https://api.supabase.com/v1/projects/${project_ref}/database/query"
          http_status="$(printf 'header = "Authorization: Bearer %s"\n' "$SUPABASE_ACCESS_TOKEN" \
            | curl --config - --silent --show-error --output /dev/null \
                --write-out '%{http_code}' --request POST "$api_url" \
                --header 'Content-Type: application/json' \
                --data-binary "@$body_file")"

          if [[ "$http_status" != "200" && "$http_status" != "201" ]]; then
            echo "Supabase returned HTTP $http_status while applying migration."
            exit 1
          fi

          echo "Supabase migration applied (HTTP $http_status)."
