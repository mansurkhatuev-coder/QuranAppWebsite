name: Apply Rassrochki Migrations

on:
  push:
    branches:
      - main
    paths:
      - rassrochki/supabase/migrations/*.sql

permissions:
  contents: read

jobs:
  apply-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply changed SQL migrations to Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.RASSROCHKI_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "Required Supabase repository secrets are not configured."
            exit 1
          fi

          supabase_host="${SUPABASE_URL#https://}"
          project_ref="${supabase_host%%.*}"
          if [[ ! "$project_ref" =~ ^[a-z0-9]+$ ]]; then
            echo "RASSROCHKI_SUPABASE_URL does not contain a valid project ref."
            exit 1
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'rassrochki/supabase/migrations/*.sql')"
          if [[ -z "$changed_files" ]]; then
            echo "No changed Rassrochki migrations were found in this push."
            exit 1
          fi

          body_file="$RUNNER_TEMP/rassrochki-migration.json"
          trap 'rm -f "$body_file"' EXIT
          api_url="https://api.supabase.com/v1/projects/${project_ref}/database/query"
          while IFS= read -r sql_file; do
            [[ -z "$sql_file" ]] && continue
            jq -n --rawfile query "$sql_file" '{query: $query}' > "$body_file"
            http_status="$(printf 'header = "Authorization: Bearer %s"\n' "$SUPABASE_ACCESS_TOKEN" \
              | curl --config - --silent --show-error --output /dev/null \
                  --write-out '%{http_code}' --request POST "$api_url" \
                  --header 'Content-Type: application/json' \
                  --data-binary "@$body_file")"

            if [[ "$http_status" != "200" && "$http_status" != "201" ]]; then
              echo "Supabase returned HTTP $http_status while applying $sql_file."
              exit 1
            fi

            echo "Applied $sql_file (HTTP $http_status)."
          done <<< "$changed_files"
