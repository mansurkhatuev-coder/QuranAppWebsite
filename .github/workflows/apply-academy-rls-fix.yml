name: Apply Academy RLS recursion fix

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/academy-rls-recursion-fix-51a2
    paths:
      - admin/supabase-migration-academy-rls-fix.sql
      - .github/workflows/apply-academy-rls-fix.yml

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply RLS fix
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
        run: |
          chmod +x scripts/apply-academy-live-migration.sh
          scripts/apply-academy-live-migration.sh admin/supabase-migration-academy-rls-fix.sql
      - name: Smoke select as recursion check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
        run: |
          BODY=$(mktemp); RESP=$(mktemp)
          python3 - <<'PY' > "$BODY"
          import json
          print(json.dumps({"query": "select count(*)::int as lessons from public.academy_lessons;"}))
          PY
          CODE=$(curl -sS -o "$RESP" -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; WaydeanMigrate/1.0; +https://waydean.ru)" \
            --data-binary @"$BODY")
          echo "HTTP $CODE"
          cat "$RESP"
          echo
          test "$CODE" = "201" -o "$CODE" = "200"
