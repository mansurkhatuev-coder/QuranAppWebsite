# One-shot: add password-reset redirect URLs for Рассрочки Auth.
# Uses the same SUPABASE_ACCESS_TOKEN as Academy/Drewo workflows.
# Project: tbkxwcphcxmneiciwoud (halal-rass.vercel.app) — NOT the website project.

name: Configure rassrochki auth URLs

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/auth-login-polish-2dc9
    paths:
      - .github/workflows/configure-rassrochki-auth-urls.yml

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Merge update-password into Auth redirect allow list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: tbkxwcphcxmneiciwoud
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          ref = os.environ["PROJECT_REF"]
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          base = f"https://api.supabase.com/v1/projects/{ref}/config/auth"
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0 (compatible; WaydeanRassrochkiAuth/1.0)",
          }

          def call(method, data=None):
              req = urllib.request.Request(
                  base,
                  data=None if data is None else json.dumps(data).encode(),
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status, json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors="replace")
                  raise SystemExit(f"HTTP {e.code}: {body}") from e

          code, cfg = call("GET")
          print("GET", code)
          print("BEFORE site_url:", cfg.get("site_url"))
          print("BEFORE uri_allow_list:", cfg.get("uri_allow_list"))

          wanted = [
              "https://halal-rass.vercel.app/update-password",
              "https://halal-rass.vercel.app/**",
              "http://localhost:3000/update-password",
              "http://localhost:3000/**",
              "http://localhost:3100/update-password",
              "http://localhost:3100/**",
          ]
          current = [u.strip() for u in (cfg.get("uri_allow_list") or "").split(",") if u.strip()]
          merged = current[:]
          for u in wanted:
              if u not in merged:
                  merged.append(u)

          payload = {
              "site_url": "https://halal-rass.vercel.app",
              "uri_allow_list": ",".join(merged),
          }
          code, out = call("PATCH", payload)
          print("PATCH", code)
          print("AFTER site_url:", out.get("site_url"))
          print("AFTER uri_allow_list:", out.get("uri_allow_list"))
          print("OK")
          PY
