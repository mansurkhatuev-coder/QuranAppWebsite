# Disabled: waydean.ru is served from GitHub Pages.
# Cloudflare Pages deploy was failing (missing CLOUDFLARE_API_TOKEN) and is unused for the live site.
# To re-enable later: restore `push` triggers below, set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID,
# and remove `if: false` from the job.
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep in sync with deploy.yml: the credential vault must never be published.
      - name: Strip private files from the published site
        run: |
          rm -rf _private
          rm -f trees/credentials.vault.json
          if find . -path ./.git -prune -o -name 'credentials.vault.json' -print | grep -q .; then
            echo "::error::credential vault would be published; refusing to deploy"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=quran-app-website
