name: Deploy Academy live Edge Function

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/academy-live-lessons-plan-51a2
      - cursor/academy-teacher-login-fix-51a2
      - cursor/academy-seed-lessons-51a2
      - cursor/academy-ux-hard-fix-51a2
      - cursor/academy-teacher-dashboard-51a2
      - cursor/academy-join-dedupe-51a2
    paths:
      - supabase/functions/academy-live/**
      - .github/workflows/deploy-academy-live.yml
      - admin/supabase-migration-academy-teachers-bootstrap.sql
      - admin/supabase-migration-academy-dashboard.sql

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Bootstrap academy_teachers from auth.users (additive)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
        run: |
          chmod +x scripts/apply-academy-live-migration.sh
          scripts/apply-academy-live-migration.sh admin/supabase-migration-academy-teachers-bootstrap.sql

      - name: Apply dashboard timing columns (additive)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
        run: |
          if [ -f admin/supabase-migration-academy-dashboard.sql ]; then
            scripts/apply-academy-live-migration.sh admin/supabase-migration-academy-dashboard.sql
          fi

      - name: Deploy academy-live function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          supabase functions deploy academy-live \
            --project-ref rivjkiksknnesahrvamf \
            --no-verify-jwt \
            --use-api
