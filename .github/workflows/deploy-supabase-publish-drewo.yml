name: Deploy Supabase publish-drewo function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure Supabase secrets for Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DREWO_PRIVATE_REPO: ${{ secrets.DREWO_PRIVATE_REPO }}
          DREWO_PRIVATE_REPO_TOKEN: ${{ secrets.DREWO_PRIVATE_REPO_TOKEN }}
          DREWO_AGGREGATE_STATS_ENABLED: ${{ secrets.DREWO_AGGREGATE_STATS_ENABLED }}
          DREWO_PASSWORD: ${{ secrets.DREWO_PASSWORD }}
          DREWO_DADA_YURT_PASSWORD: ${{ secrets.DREWO_DADA_YURT_PASSWORD }}
          DREWO_REKLAMA_PASSWORD: ${{ secrets.DREWO_REKLAMA_PASSWORD }}
          DREWO_SUPER_PASSWORD: ${{ secrets.DREWO_SUPER_PASSWORD }}
          DREWO_DADA_YURT_SUPER_PASSWORD: ${{ secrets.DREWO_DADA_YURT_SUPER_PASSWORD }}
          DREWO_REKLAMA_SUPER_PASSWORD: ${{ secrets.DREWO_REKLAMA_SUPER_PASSWORD }}
          DREWO_SESSION_SECRET: ${{ secrets.DREWO_SESSION_SECRET }}
          DREWO_VAULT_KEY: ${{ secrets.DREWO_VAULT_KEY }}
          WAYDEAN_ADMIN_USER_ID: ${{ secrets.WAYDEAN_ADMIN_USER_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN repository secret"
            exit 1
          fi
          if [ -z "$DREWO_PRIVATE_REPO" ]; then
            echo "Missing DREWO_PRIVATE_REPO repository secret"
            exit 1
          fi
          if [ -z "$DREWO_PRIVATE_REPO_TOKEN" ]; then
            echo "Missing DREWO_PRIVATE_REPO_TOKEN repository secret"
            exit 1
          fi
          if [[ ! "$DREWO_PRIVATE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "DREWO_PRIVATE_REPO must have the form owner/repository"
            exit 1
          fi
          if [[ "$DREWO_PRIVATE_REPO" != "mansurkhatuev-coder/Drewo-family-data" ]]; then
            echo "DREWO_PRIVATE_REPO does not match the configured family-data repository"
            exit 1
          fi
          if [[ -n "$DREWO_AGGREGATE_STATS_ENABLED" && "$DREWO_AGGREGATE_STATS_ENABLED" != "true" && "$DREWO_AGGREGATE_STATS_ENABLED" != "false" ]]; then
            echo "DREWO_AGGREGATE_STATS_ENABLED must be true or false"
            exit 1
          fi
          DREWO_AGGREGATE_STATS_ENABLED="${DREWO_AGGREGATE_STATS_ENABLED:-false}"
          repo_metadata="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H @- \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$DREWO_PRIVATE_REPO" \
            <<<"Authorization: Bearer $DREWO_PRIVATE_REPO_TOKEN")"
          if ! jq -e '.private == true' >/dev/null <<<"$repo_metadata"; then
            echo "DREWO_PRIVATE_REPO is unavailable or is not private"
            exit 1
          fi
          SECRET_ARGS=(
            DREWO_GITHUB_TOKEN="$DREWO_PRIVATE_REPO_TOKEN"
            DREWO_PRIVATE_REPO="$DREWO_PRIVATE_REPO"
            DREWO_AGGREGATE_STATS_ENABLED="$DREWO_AGGREGATE_STATS_ENABLED"
          )
          # Omitted GitHub secrets leave the values already configured in Supabase intact.
          for family_secret in DREWO_PASSWORD DREWO_DADA_YURT_PASSWORD DREWO_REKLAMA_PASSWORD; do
            if [[ -n "${!family_secret}" ]]; then
              SECRET_ARGS+=("$family_secret=${!family_secret}")
            fi
          done
          if [ -n "$DREWO_SUPER_PASSWORD" ]; then
            SECRET_ARGS+=(DREWO_SUPER_PASSWORD="$DREWO_SUPER_PASSWORD")
          else
            echo "Warning: DREWO_SUPER_PASSWORD is empty; Хьоти некъ super-admin stays unavailable."
          fi
          if [ -n "$DREWO_DADA_YURT_SUPER_PASSWORD" ]; then
            SECRET_ARGS+=(DREWO_DADA_YURT_SUPER_PASSWORD="$DREWO_DADA_YURT_SUPER_PASSWORD")
          else
            echo "Warning: DREWO_DADA_YURT_SUPER_PASSWORD is empty; Дади-Юрт super-admin stays unavailable."
          fi
          if [ -n "$DREWO_REKLAMA_SUPER_PASSWORD" ]; then
            SECRET_ARGS+=(DREWO_REKLAMA_SUPER_PASSWORD="$DREWO_REKLAMA_SUPER_PASSWORD")
          else
            echo "Warning: DREWO_REKLAMA_SUPER_PASSWORD is empty; демо-древо super-admin stays unavailable."
          fi
          if [ -n "$DREWO_SESSION_SECRET" ]; then
            SECRET_ARGS+=(DREWO_SESSION_SECRET="$DREWO_SESSION_SECRET")
          else
            echo "Warning: DREWO_SESSION_SECRET is empty; Некъ sessions fall back to signing with GITHUB_TOKEN, so rotating that token logs everyone out."
          fi
          if [ -n "$DREWO_VAULT_KEY" ]; then
            SECRET_ARGS+=(DREWO_VAULT_KEY="$DREWO_VAULT_KEY")
          else
            echo "Warning: DREWO_VAULT_KEY is empty; the credential vault stays unreadable (hub-credentials shows no passwords)."
          fi
          if [ -n "$WAYDEAN_ADMIN_USER_ID" ]; then
            SECRET_ARGS+=(WAYDEAN_ADMIN_USER_ID="$WAYDEAN_ADMIN_USER_ID")
          else
            echo "Warning: WAYDEAN_ADMIN_USER_ID is empty; preserving the existing Supabase value."
          fi
          if [ -n "$VAPID_PUBLIC_KEY" ] && [ -n "$VAPID_PRIVATE_KEY" ]; then
            SECRET_ARGS+=(
              VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY"
              VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY"
              VAPID_SUBJECT="${VAPID_SUBJECT:-mailto:drewo@waydean.ru}"
            )
          else
            echo "Warning: VAPID keys empty; Web Push will stay disabled until secrets are set."
          fi
          # Hub uses the existing Supabase admin login (no email allowlist).
          supabase secrets unset DREWO_HUB_EMAILS \
            --project-ref rivjkiksknnesahrvamf 2>/dev/null || true
          supabase secrets set \
            --project-ref rivjkiksknnesahrvamf \
            "${SECRET_ARGS[@]}"

      - name: Deploy publish-drewo Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy publish-drewo \
            --project-ref rivjkiksknnesahrvamf \
            --no-verify-jwt \
            --use-api
