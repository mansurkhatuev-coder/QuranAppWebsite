name: Deploy Supabase publish-drewo function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure Supabase secrets for Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WEBSITE_PUBLISH_TOKEN: ${{ secrets.WEBSITE_PUBLISH_TOKEN }}
          DREWO_PASSWORD: ${{ secrets.DREWO_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN repository secret"
            exit 1
          fi
          if [ -z "$WEBSITE_PUBLISH_TOKEN" ]; then
            echo "Missing WEBSITE_PUBLISH_TOKEN repository secret"
            exit 1
          fi
          PASSWORD_VALUE="${DREWO_PASSWORD:-гуно}"
          supabase secrets set \
            --project-ref rivjkiksknnesahrvamf \
            GITHUB_TOKEN="$WEBSITE_PUBLISH_TOKEN" \
            GITHUB_REPO=mansurkhatuev-coder/QuranAppWebsite \
            DREWO_PASSWORD="$PASSWORD_VALUE"

      - name: Deploy publish-drewo Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy publish-drewo \
            --project-ref rivjkiksknnesahrvamf \
            --no-verify-jwt \
            --use-api
