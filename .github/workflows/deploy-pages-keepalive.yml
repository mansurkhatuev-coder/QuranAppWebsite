name: Deploy Pages keepalive

# Separate workflow so a fresh schedule can publish when deploy.yml push triggers skip.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep in sync with deploy.yml: the credential vault must never be published.
      - name: Strip private files from the published site
        run: |
          rm -rf _private
          rm -f trees/credentials.vault.json
          if find . -path ./.git -prune -o -name 'credentials.vault.json' -print | grep -q .; then
            echo "::error::credential vault would be published; refusing to deploy"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
