name: Deploy Pages keepalive

# Separate workflow so a fresh schedule can publish when deploy.yml push triggers skip.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify public artifact builder and transition routes
        run: node --test scripts/prepare-pages-artifact.test.mjs scripts/legacy-route-transitions.test.mjs

      # Keep both scheduled publishers on the same sanitized artifact path.
      - name: Prepare sanitized Pages artifact
        run: node scripts/prepare-pages-artifact.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
