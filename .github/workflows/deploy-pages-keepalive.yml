name: Deploy Pages keepalive

# Separate workflow so a fresh schedule can publish when deploy.yml push triggers skip.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Explicit release gate: enable only after private-reader and legacy-route verification.
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.DREWO_PRIVATE_PAGES_READY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify private Pages build
        run: node --test scripts/prepare-pages-artifact.test.mjs

      - name: Build filtered Pages artifact
        run: node scripts/prepare-pages-artifact.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
