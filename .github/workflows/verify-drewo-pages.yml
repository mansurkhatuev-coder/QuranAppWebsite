name: Verify Drewo compatibility and Pages artifact

on:
  pull_request:
    paths:
      - '.github/workflows/verify-drewo-pages.yml'
      - 'scripts/prepare-pages-artifact.mjs'
      - 'scripts/prepare-pages-artifact.test.mjs'
      - 'scripts/legacy-route-transitions.mjs'
      - 'scripts/legacy-route-transitions.test.mjs'
      - 'scripts/legacy-transitions.json'
      - 'supabase/functions/publish-drewo/legacy-transition-manifest.mjs'
      - 'nek/**'
      - 'drewo*/**'
      - 'trees/**'
      - 'assets/**'
      - 'admin/**'
      - 'docs/design/waydean/**'
      - 'docs/legacy-route-rollout.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test migration routes and artifact privacy
        run: node --test scripts/prepare-pages-artifact.test.mjs scripts/legacy-route-transitions.test.mjs
      - name: Build sanitized Pages artifact
        run: node scripts/prepare-pages-artifact.mjs
      - name: Confirm transitioned routes omit former family pages
        shell: bash
        run: |
          for tree in drewo-adam drewo-covza drewo-dada-yurt drewo-eldarovy drewo-guzat drewo-shahiid-nek; do
            test ! -e "dist/pages/$tree/family-tree.json"
            test ! -d "dist/pages/$tree/photos"
          done
