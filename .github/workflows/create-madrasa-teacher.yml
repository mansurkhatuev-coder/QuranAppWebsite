# One-shot: provision madrasa Academy teacher account.
# Uses SUPABASE_ACCESS_TOKEN → service_role → Auth Admin + academy_teachers upsert.
# Credentials are passed only as Actions env for this branch job (not printed).

name: Create madrasa Academy teacher

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/academy-zahet-task1-37e8
    paths:
      - .github/workflows/create-madrasa-teacher.yml
      - scripts/create-academy-teacher.mjs

permissions:
  contents: read

concurrency:
  group: create-madrasa-teacher
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create / update teacher
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
          SUPABASE_URL: https://rivjkiksknnesahrvamf.supabase.co
          TEACHER_EMAIL: abdurahman@waydean.com
          TEACHER_PASSWORD: medrese95
          TEACHER_NAME: Абдурахман · медресе
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          node scripts/create-academy-teacher.mjs

      - name: Verify teacher row
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
        run: |
          set -euo pipefail
          BODY=$(mktemp); RESP=$(mktemp)
          python3 - <<'PY' > "$BODY"
          import json
          print(json.dumps({"query": """
          select t.user_id::text, t.display_name, t.is_active, u.email
          from public.academy_teachers t
          left join auth.users u on u.id = t.user_id
          where lower(u.email) = lower('abdurahman@waydean.com');
          """}))
          PY
          CODE=$(curl -sS -o "$RESP" -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; WaydeanMigrate/1.0; +https://waydean.ru)" \
            --data-binary @"$BODY")
          echo "verify HTTP $CODE"
          cat "$RESP"
          echo
          test "$CODE" = "200" -o "$CODE" = "201"
          python3 - <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=data if isinstance(data,list) else data.get('data') or data.get('result') or []
          if isinstance(data,dict) and not rows and 'email' in str(data):
              rows=[data]
          # Management API often returns list of row objects
          if not rows:
              raise SystemExit('teacher row not found after provision')
          print('teacher ok:', rows[0] if isinstance(rows,list) else rows)
          PY
          "$RESP"
