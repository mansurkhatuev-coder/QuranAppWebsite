name: Query Academy teachers count

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/academy-teacher-login-fix-51a2
    paths:
      - admin/supabase-query-academy-teachers-count.sql
      - .github/workflows/query-academy-teachers.yml
      - admin/supabase-migration-academy-teachers-bootstrap.sql

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Monday zahet sessions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
        run: |
          set -euo pipefail
          chmod +x scripts/apply-academy-live-migration.sh
          scripts/apply-academy-live-migration.sh admin/supabase-query-monday-zahet.sql

      - name: Monday zahet per-student scores
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
        run: |
          set -euo pipefail
          scripts/apply-academy-live-migration.sh admin/supabase-query-monday-zahet-people.sql

      - name: All sessions Monday window
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
        run: |
          set -euo pipefail
          scripts/apply-academy-live-migration.sh admin/supabase-query-monday-all-sessions.sql
