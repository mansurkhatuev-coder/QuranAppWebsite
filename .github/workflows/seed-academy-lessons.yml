name: Seed Academy demo lessons

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/academy-seed-lessons-51a2
    paths:
      - admin/supabase-migration-academy-seed-lessons.sql
      - .github/workflows/seed-academy-lessons.yml
      - supabase/functions/academy-live/**

permissions:
  contents: read

jobs:
  seed-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap teachers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
        run: |
          chmod +x scripts/apply-academy-live-migration.sh
          scripts/apply-academy-live-migration.sh admin/supabase-migration-academy-teachers-bootstrap.sql

      - name: Seed demo lessons
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
        run: |
          scripts/apply-academy-live-migration.sh admin/supabase-migration-academy-seed-lessons.sql

      - name: Count seeded lessons
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: rivjkiksknnesahrvamf
        run: |
          BODY=$(mktemp); RESP=$(mktemp)
          python3 - <<'PY' > "$BODY"
          import json
          print(json.dumps({"query": """
          select l.title, count(*)::int as owners
          from public.academy_lessons l
          where l.title in (
            'Фикх: условия намаза',
            'Акыда: основы веры',
            'Коран: короткая проверка'
          )
          group by l.title
          order by l.title;
          """}))
          PY
          CODE=$(curl -sS -o "$RESP" -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; WaydeanMigrate/1.0; +https://waydean.ru)" \
            --data-binary @"$BODY")
          echo "HTTP $CODE"; cat "$RESP"; echo

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy academy-live (save_lesson)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy academy-live \
            --project-ref rivjkiksknnesahrvamf \
            --no-verify-jwt \
            --use-api
