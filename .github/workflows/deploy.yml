name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  # Safety net: some merges/pushes skip the push trigger (site stays stale).
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Explicit release gate: enable only after private-reader and legacy-route verification.
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.DREWO_PRIVATE_PAGES_READY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify private family repository
        env:
          DREWO_PRIVATE_REPO: ${{ secrets.DREWO_PRIVATE_REPO }}
          DREWO_PRIVATE_REPO_TOKEN: ${{ secrets.DREWO_PRIVATE_REPO_TOKEN }}
        run: |
          if [ -z "$DREWO_PRIVATE_REPO" ] || [ -z "$DREWO_PRIVATE_REPO_TOKEN" ]; then
            echo "Missing private family repository settings"
            exit 1
          fi
          if [[ ! "$DREWO_PRIVATE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "DREWO_PRIVATE_REPO must have the form owner/repository"
            exit 1
          fi
          if [[ "$DREWO_PRIVATE_REPO" != "mansurkhatuev-coder/Drewo-family-data" ]]; then
            echo "DREWO_PRIVATE_REPO does not match the configured family-data repository"
            exit 1
          fi
          repo_metadata="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H @- \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$DREWO_PRIVATE_REPO" \
            <<<"Authorization: Bearer $DREWO_PRIVATE_REPO_TOKEN")"
          if ! jq -e '.private == true' >/dev/null <<<"$repo_metadata"; then
            echo "DREWO_PRIVATE_REPO is unavailable or is not private"
            exit 1
          fi

      - name: Checkout private family source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DREWO_PRIVATE_REPO }}
          ref: main
          token: ${{ secrets.DREWO_PRIVATE_REPO_TOKEN }}
          path: private-drewo
          persist-credentials: false

      - name: Verify private Pages build
        run: node --test scripts/prepare-pages-artifact.test.mjs

      - name: Build filtered Pages artifact
        run: node scripts/prepare-pages-artifact.mjs --release --private-source private-drewo

      - name: Remove private family source
        if: always()
        run: rm -rf -- private-drewo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
