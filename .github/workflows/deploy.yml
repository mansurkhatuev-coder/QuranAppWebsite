name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  # Safety net: some merges/pushes skip the push trigger (site stays stale).
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `_private/` holds the encrypted credential vault written by publish-drewo.
      # It must never reach the public site; strip it from the checkout (not the repo).
      - name: Strip private files from the published site
        run: |
          rm -rf _private
          rm -f trees/credentials.vault.json
          if find . -path ./.git -prune -o -name 'credentials.vault.json' -print | grep -q .; then
            echo "::error::credential vault would be published; refusing to deploy"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
