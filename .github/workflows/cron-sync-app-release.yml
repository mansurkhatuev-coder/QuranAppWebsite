name: Cron sync app-release channels

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-app-release
        env:
          SYNC_APP_RELEASE_CRON_SECRET: ${{ secrets.SYNC_APP_RELEASE_CRON_SECRET }}
        run: |
          if [ -z "$SYNC_APP_RELEASE_CRON_SECRET" ]; then
            echo "Missing SYNC_APP_RELEASE_CRON_SECRET"
            exit 1
          fi
          curl -fsS -X POST \
            "https://rivjkiksknnesahrvamf.supabase.co/functions/v1/sync-app-release" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${SYNC_APP_RELEASE_CRON_SECRET}" \
            -d '{}'
