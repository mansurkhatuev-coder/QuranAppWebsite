# Apply Рассрочки SQL migrations via Supabase Management API.
# Project: tbkxwcphcxmneiciwoud (halal-rass.vercel.app)

name: Apply rassrochki migration

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: Path to SQL file under rassrochki/supabase/migrations/
        required: true
        default: rassrochki/supabase/migrations/014_schedule_on_full_amount_default.sql
  push:
    branches:
      - cursor/rassrochki-contract-back-schedule-d67d
    paths:
      - rassrochki/supabase/migrations/014_schedule_on_full_amount_default.sql
      - .github/workflows/apply-rassrochki-migration.yml
      - scripts/apply-academy-live-migration.sh

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: tbkxwcphcxmneiciwoud
          SQL_FILE: ${{ github.event.inputs.sql_file || 'rassrochki/supabase/migrations/014_schedule_on_full_amount_default.sql' }}
        run: |
          set -euo pipefail
          chmod +x scripts/apply-academy-live-migration.sh
          scripts/apply-academy-live-migration.sh "$SQL_FILE"

      - name: Verify schedule_on_full_amount default
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: tbkxwcphcxmneiciwoud
        run: |
          set -euo pipefail
          RESP="$(mktemp)"
          BODY="$(mktemp)"
          python3 - "$BODY" <<'PY'
          import json, sys
          q = """
          select column_default
          from information_schema.columns
          where table_schema = 'public'
            and table_name = 'loans'
            and column_name = 'schedule_on_full_amount';
          """
          json.dump({"query": q}, open(sys.argv[1], "w", encoding="utf-8"), ensure_ascii=False)
          PY
          CODE="$(
            curl -sS -o "$RESP" -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -H "User-Agent: Mozilla/5.0 (compatible; WaydeanRassrochkiMigrate/1.0)" \
              --data-binary @"$BODY"
          )"
          echo "HTTP $CODE"
          cat "$RESP"
          echo
          test "$CODE" = "200" -o "$CODE" = "201"
          grep -q true "$RESP"
          echo "Verified: default is true"
