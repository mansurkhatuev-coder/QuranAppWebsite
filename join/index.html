<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0B0F13" />
    <meta name="description" content="Присоединиться к live-уроку Академии по коду." />
    <title>Войти в урок — Академия</title>
    <link rel="icon" href="../assets/icon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Manrope:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="../academy/academy.css?v=1" />
  </head>
  <body class="academy-body">
    <div class="academy-shell">
      <div class="academy-top">
        <a class="academy-brand" href="/">
          <img src="../assets/icon.png" width="36" height="36" alt="" />
          <strong>Урок</strong>
        </a>
      </div>

      <p class="academy-kicker">Для учеников</p>
      <h1 class="academy-title">Войти в урок</h1>
      <p class="academy-muted">
        Введите код с доски или откройте ссылку из WhatsApp. Регистрация не нужна.
      </p>

      <div class="academy-card" id="code-card">
        <form id="code-form" class="academy-form">
          <label>
            Код урока
            <input
              id="join-code"
              name="code"
              inputmode="numeric"
              pattern="[0-9]{4,8}"
              maxlength="8"
              autocomplete="one-time-code"
              placeholder="482719"
              required
            />
          </label>
          <label>
            Ваше имя
            <input id="join-name" name="name" maxlength="40" autocomplete="nickname" placeholder="Мухаммад" required />
          </label>
          <div class="academy-actions">
            <button type="submit" class="academy-btn academy-btn--primary" id="join-submit">
              Войти
            </button>
          </div>
          <p id="join-error" class="academy-error" hidden></p>
          <p id="join-hint" class="academy-muted" style="margin-top: 0.75rem">
            Фаза 0: экран и сохранение имени/кода локально. Подключение к live-сессии — после Edge
            Functions (<code>academy-session-join</code> / <code>resume</code>).
          </p>
        </form>
      </div>

      <div class="academy-card" id="waiting-card" hidden>
        <p class="academy-kicker">Лобби</p>
        <p class="academy-title" style="font-size: 1.6rem" id="waiting-title">Ожидание учителя…</p>
        <p class="academy-muted" id="waiting-meta"></p>
        <div class="academy-actions">
          <button type="button" class="academy-btn" id="btn-leave">Выйти</button>
        </div>
      </div>
    </div>

    <script src="../academy/academy-shared.js?v=1"></script>
    <script src="./join.js?v=1"></script>
  </body>
</html>
