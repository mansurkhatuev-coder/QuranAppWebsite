<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0B0F13" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Присоединиться к live-уроку Академии по коду." />
    <title>Войти в урок — Академия</title>
    <link rel="icon" href="../assets/icon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Manrope:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="../academy/academy.css?v=7" />
  </head>
  <body class="academy-body">
    <div class="academy-shell">
      <div class="academy-top">
        <a class="academy-brand" href="/">
          <img src="../assets/icon.png" width="36" height="36" alt="" />
          <strong>Урок</strong>
        </a>
      </div>

      <p class="academy-kicker">Для учеников</p>
      <h1 class="academy-title">Войти в урок</h1>
      <p class="academy-muted">Код с доски или ссылка из WhatsApp. Регистрация не нужна.</p>

      <div class="academy-card" id="code-card">
        <form id="code-form" class="academy-form">
          <label>
            Код урока
            <input id="join-code" name="code" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" required placeholder="482719" />
          </label>
          <label>
            Ваше имя
            <input id="join-name" name="name" maxlength="40" autocomplete="nickname" required placeholder="Мухаммад" />
          </label>
          <div class="academy-actions">
            <button type="submit" class="academy-btn academy-btn--primary" id="join-submit">Войти</button>
          </div>
          <p id="join-error" class="academy-error" hidden></p>
        </form>
      </div>

      <div class="academy-card" id="play-card" hidden>
        <p class="academy-kicker" id="play-kicker">Лобби</p>
        <p class="academy-question-prompt" id="play-title">Ожидание учителя…</p>
        <div id="play-timer" class="academy-timer" hidden>
          <div class="academy-timer__label">Осталось</div>
          <div id="play-timer-value" class="academy-timer__value">—</div>
          <div class="academy-timer__bar"><span id="play-timer-bar"></span></div>
        </div>
        <div id="play-body"></div>
        <p id="play-feedback" class="academy-ok" hidden></p>
        <p id="play-error" class="academy-error" hidden></p>
        <div class="academy-actions">
          <button type="button" class="academy-btn academy-btn--primary" id="btn-submit-answer" hidden>Ответить</button>
          <button type="button" class="academy-btn" id="btn-leave">Выйти</button>
        </div>
      </div>
    </div>

    <script src="../admin/supabase-config.js?v=7"></script>
    <script src="../academy/academy-shared.js?v=5"></script>
    <script src="./join.js?v=7"></script>
  </body>
</html>
