<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f1c16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trees" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <title>Trees — пульт древ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;650;700&family=Fraunces:opsz,wght@9..144,500;9..144,560;9..144,650&display=swap"
    />
    <link rel="stylesheet" href="./trees.css?v=2" />
  </head>
  <body>
    <div class="bg-stage" aria-hidden="true">
      <div class="bg-mesh"></div>
      <div class="bg-grain"></div>
    </div>

    <div id="pwa-banner" class="pwa-banner" hidden>
      <div>
        <strong>Установить Trees</strong>
        <p>Пульт древ на экран Домой</p>
      </div>
      <div class="pwa-banner-actions">
        <button type="button" id="pwa-install" class="btn btn-primary">Установить</button>
        <button type="button" id="pwa-dismiss" class="btn btn-ghost">Позже</button>
      </div>
    </div>

    <div id="boot-overlay" class="boot-overlay" hidden>
      <div class="boot-card" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p id="boot-text" class="muted">Загрузка…</p>
      </div>
    </div>

    <div id="login-screen" class="login-shell">
      <div class="login-card">
        <div class="brand-mark">
          <img src="./icon-192.png" width="40" height="40" alt="" />
          <span class="brand-word">Trees</span>
        </div>
        <h1>Пульт древ</h1>
        <p class="muted">Онлайн, визиты и состав — для теста. Ссылки родственников не меняются.</p>
        <form id="login-form" class="login-form" method="post" action="/trees/" autocomplete="on">
          <label>
            Email
            <input
              id="login-email"
              name="username"
              type="email"
              autocomplete="username"
              autocapitalize="off"
              spellcheck="false"
              required
            />
          </label>
          <label>
            Пароль
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <p id="login-setup-notice" class="muted" hidden>Сервис не настроен.</p>
          <button type="submit" class="btn btn-primary" id="login-submit">Войти</button>
          <p id="login-error" class="error" hidden>Неверные данные для входа</p>
        </form>
      </div>
    </div>

    <div id="app-screen" class="shell" hidden>
      <header class="topbar">
        <div class="topbar-brand">
          <span class="brand-word">Trees</span>
          <p class="muted" id="updated-at">Обновление…</p>
        </div>
        <div class="topbar-actions">
          <button type="button" class="icon-btn" id="refresh-btn" title="Обновить" aria-label="Обновить">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.6-6.2" />
              <polyline points="21 3 21 9 15 9" />
            </svg>
          </button>
          <button type="button" class="btn btn-ghost" id="logout-btn">Выйти</button>
        </div>
      </header>

      <section class="summary" aria-label="Сводка">
        <div class="summary-pill">
          <span class="label">Онлайн</span>
          <span class="value" id="sum-online">—</span>
        </div>
        <div class="summary-pill">
          <span class="label">Визиты</span>
          <span class="value" id="sum-visits">—</span>
        </div>
        <div class="summary-pill">
          <span class="label">Люди</span>
          <span class="value" id="sum-people">—</span>
        </div>
        <div class="summary-pill">
          <span class="label">Добавлено</span>
          <span class="value" id="sum-added">—</span>
        </div>
      </section>

      <section id="tree-list" class="tree-list" aria-label="Древа"></section>
      <p id="status-line" class="status-line" aria-live="polite"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/auth-lock.js?v=1"></script>
    <script src="./supabase-config.js?v=1"></script>
    <script src="./trees.js?v=2"></script>
  </body>
</html>
