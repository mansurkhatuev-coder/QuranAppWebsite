<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080d0e">
  <title>Waydean — Видео на устройстве</title>
  <link rel="stylesheet" href="./browser-export.css">
</head>
<body class="browser-export-page">
  <main id="browser-export-root" aria-live="polite">
    <p class="browser-export-loading">Открываем локальный экспорт…</p>
  </main>
  <script type="module">
    import("./browser-export-studio.mjs?v=20261015-preview-play").catch(error => {
      const root = document.getElementById("browser-export-root");
      const message = document.createElement("p");
      message.className = "browser-export-error";
      message.setAttribute("role", "alert");
      message.textContent = "Не удалось открыть видеоэкспорт. Обновите страницу или вернитесь к древу.";
      root.replaceChildren(message);
      console.error("Waydean video export failed to load", error);
    });
  </script>
</body>
</html>
